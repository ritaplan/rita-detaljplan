# Värdens nginx: skickar /planmosaik/ vidare till webbbehållaren (127.0.0.1:8090), som i sin tur serverar Origo-kartan
# och vidarebefordrar till GeoServer (/geoserver/), QGIS Server (/qgis/) och Martin (/tiles/).
# Läggs in i server-blocket för HTTPS med installera.sh (include-rad), aldrig för hand.
location = /planmosaik {
    return 301 /planmosaik/;
}

location /planmosaik/ {
    # Samma begränsning per IP som övriga tjänster på servern (zonen api_per_ip finns i conf.d/api-limit.conf)
    limit_req zone=api_per_ip burst=100 nodelay;
    limit_req_status 429;

    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
