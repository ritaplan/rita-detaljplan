# Testmiljö för planmosaiken: två sätt att publicera samma publiceringsvy (publicering.planmosaik) till en webbkarta.
#
#   GeoServer    -> WMS, WFS och vektorrutor (/geoserver/...)
#   QGIS Server  -> WMS och WFS              (/qgis/...)
#   web (nginx)  -> Origo-kartan (statiska filer) och vidarebefordran till de två
#
# Båda läser databasen med den skrivskyddade rollen karta_ro, via nätverket postgis_default (samma nätverk som
# PostGIS-behållaren). Lösenorden ligger i .env, som skapas av forbered.sh och inte checkas in.
# Minnesgränserna är satta för en liten server (4 GB) som också kör annat.
name: planmosaik

services:
  geoserver:
    image: docker.osgeo.org/geoserver:3.0.2
    container_name: planmosaik-geoserver
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD}
      SKIP_DEMO_DATA: "true"
      EXTRA_JAVA_OPTS: -Xms128m -Xmx640m
      # Tillägget vectortiles (vektorrutor, MVT) hämtas vid första starten ur GeoServers officiella nedladdningar
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: vectortiles
    volumes:
      - geoserver_data:/opt/geoserver_data
    ports:
      - "127.0.0.1:8081:8080"  # administrationen nås bara härifrån (SSH-tunnel), inte via webben
    mem_limit: 1g
    networks: [default, postgis_default]

  qgis-server:
    image: qgis/qgis-server:4.2.3-resolute
    container_name: planmosaik-qgis
    restart: unless-stopped
    environment:
      QGIS_PROJECT_FILE: /io/data/planmosaik.qgs
      QGIS_SERVER_MAX_THREADS: "2"
    volumes:
      - ./qgis:/io/data:ro
      # Systemplatsen för tjänstedefinitioner: FastCGI-processerna ärver inte miljövariabeln PGSERVICEFILE
      - ./qgis/pg_service.conf:/etc/postgresql-common/pg_service.conf:ro
    mem_limit: 512m
    networks: [default, postgis_default]

  web:
    image: nginx:alpine
    container_name: planmosaik-web
    restart: unless-stopped
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/html:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:8090:80"
    mem_limit: 64m
    depends_on: [geoserver, qgis-server]

volumes:
  geoserver_data:

networks:
  postgis_default:
    external: true
