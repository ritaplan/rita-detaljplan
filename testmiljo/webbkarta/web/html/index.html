<!DOCTYPE html>
<html lang="sv">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Planmosaik</title>
	<link href="css/style.css" rel="stylesheet">
	<link href="planmosaik-info.css" rel="stylesheet">
	<link rel="shortcut icon" href="img/png/logo.png">
</head>
<body>
<div id="app-wrapper">
</div>
<script src="js/origo.min.js"></script>
<script src="planmosaik.js"></script>
<script src="planmosaik-info.js"></script>
<script type="text/javascript">
	// Origo-ramverket (js/, css/, img/) hämtas av hamta_origo.sh. Kartans innehåll står i index.json.
	var origo = Origo('index.json');
	// Informationspanelen (klick på en plan). Uppgifterna kommer ur GeoServer; byt adresserna om kartservern är en annan.
	origo.on('load', function (viewer) {
		PlanMosaikInfo.init(viewer, { infoUrl: 'geoserver/planmosaik/wms', wfsUrl: 'geoserver/planmosaik/ows' });
	});
</script>
</body>
</html>
