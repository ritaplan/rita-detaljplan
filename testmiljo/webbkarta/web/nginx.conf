# Webbplatsen för planmosaiken (körs i behållaren web). Origo-filerna ligger i html/.
# Värdens nginx skickar /planmosaik/ hit; sökvägarna nedan är relativa till det.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vektorrutor från Martin: /tiles/planmosaik/{z}/{x}/{y}
    location /tiles/ {
        proxy_pass http://martin:3000/;
        # Martin bygger adresserna i TileJSON av detta; utan den pekar de på behållarens interna namn.
        # /planmosaik är sökvägen som värdens nginx publicerar kartan på (nginx-host/planmosaik.conf).
        proxy_set_header X-Rewrite-URL /planmosaik$request_uri;
        proxy_set_header Host $http_host;
    }

    # GeoServers administration och REST nås bara via SSH-tunnel till 127.0.0.1:8081, aldrig härifrån.
    location ~ ^/geoserver/(web|rest|j_spring_security_check) {
        return 403;
    }
    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Prefix /planmosaik;
    }

    # QGIS Server: projektet väljs av servern (QGIS_PROJECT_FILE), anropet kan inte peka på någon annan fil.
    location /qgis/ {
        proxy_pass http://qgis-server:80/ows/;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
