# Håller de fastlåsta versionerna av GitHub Actions (se .github/workflows/) uppdaterade. Pluginet självt har inga
# Python-paket att uppdatera: det använder bara QGIS och Pythons standardbibliotek.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Stegen i github/codeql-action måste ha samma version (annars fallerar analysen), så de uppdateras i samma förslag
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
