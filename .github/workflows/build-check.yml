name: Bygg och materiallista

# Kontrollerar det som går att kontrollera utan QGIS: att koden går att kompilera, att zip-filen byggs likadant två
# gånger (reproducerbart bygge), att koden inte har fått nya beroenden och att materiallistan (SBOM) kan skapas.
# Testsviten (tests/) kräver QGIS 4 och körs lokalt enligt CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kompilera all kod
        run: python3 -m compileall -q rita_detaljplan tools
      - name: Kodkontroll (ruff, regler i ruff.toml)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.17.3"
          args: "check"
      - name: Bygg zip-filen två gånger och jämför
        run: |
          python3 tools/build_zip.py
          sha256sum dist/*.zip > first.sha256
          rm -r dist
          python3 tools/build_zip.py
          sha256sum dist/*.zip > second.sha256
          diff first.sha256 second.sha256
      - name: Skapa materiallistan (stoppar om koden fått ett nytt beroende)
        run: python3 tools/build_sbom.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-och-kontrollsumma
          path: |
            dist/*.sbom.cdx.json
            dist/*.sha256
          retention-days: 30
